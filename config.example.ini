; =====================================================================
; 学生宿舍报修管理系统（Python 版）配置文件模板
; 首次运行时自动复制为 config.ini，请修改 config.ini（不要改本文件）。
; 修改后需要重新启动系统才会生效。等号右边的值不需要加引号。
; =====================================================================

[database]
; MySQL 地址和端口（MySQL 安装在本机就保持默认）
host = localhost
port = 3306
; MySQL 用户名和密码：改成你安装 MySQL 时设置的 root 密码
user = root
password = root
; 数据库名：不需要手动创建，首次启动时自动建库、建表、录入维修人员账号
name = dorm_repair_py

[server]
; 网站端口：浏览器访问 http://localhost:端口号；被占用时可改成 5001 等
port = 5000
; 报修图片保存目录（相对于项目根目录，也可以写绝对路径）
upload_dir = uploads
