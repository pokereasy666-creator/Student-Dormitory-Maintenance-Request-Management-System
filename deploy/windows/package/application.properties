# Dorm Repair System - deployment config
# ------------------------------------------------------------------
# 部署配置文件：修改后重新运行 start.bat 生效。
# 注意：等号右边的值不要包含中文，也不要加引号。
# ------------------------------------------------------------------

# ===== MySQL 数据库连接 =====
# 数据库地址和端口（MySQL 安装在本机就保持默认）
DB_HOST=localhost
DB_PORT=3306
# MySQL 用户名和密码：改成你安装 MySQL 时设置的 root 密码
DB_USERNAME=root
DB_PASSWORD=root
# 数据库 dorm_repair 不需要手动创建：首次启动时自动建库、建表、录入维修人员账号

# ===== 网站访问端口 =====
# 浏览器访问 http://localhost:端口号；8080 被占用时可改成 8081 等
server.port=8080

# ===== 以下一般不需要修改 =====
# 报修图片保存目录（相对于本文件夹）
app.upload-dir=./uploads
# 运行日志
logging.file.name=logs/app.log
# 正式运行：开启页面缓存，不在日志中打印 SQL
spring.thymeleaf.cache=true
logging.level.com.dorm.repair.mapper=info
