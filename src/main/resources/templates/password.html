<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('password')}"></header>
<main class="container narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <section class="card">
        <h2>修改密码</h2>
        <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post" class="form">
            <label>原密码
                <input type="password" th:field="*{oldPassword}" autocomplete="current-password" required>
            </label>
            <div class="field-error" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>

            <label>新密码
                <input type="password" th:field="*{newPassword}" placeholder="6~20 位" autocomplete="new-password" required>
            </label>
            <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>

            <label>确认新密码
                <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            </label>
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

            <p class="muted small">修改成功后需要使用新密码重新登录。</p>
            <button type="submit" class="btn btn-primary">确认修改</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
